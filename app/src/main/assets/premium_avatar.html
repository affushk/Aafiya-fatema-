<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;
background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.98),rgba(255,244,249,.84) 48%,rgba(239,233,246,.76) 100%)}
#api-frame{width:100%;height:100%;border:0;background:transparent;transition:transform .28s ease;transform-origin:50% 58%}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.88);font:600 13px system-ui;color:#745d72;pointer-events:none}
#credit{position:absolute;left:10px;bottom:7px;font:500 8px system-ui;color:rgba(95,75,94,.45);pointer-events:none}
.talk{animation:talkBob .34s ease-in-out infinite alternate}
.wave{animation:wavePop .48s ease-in-out 4 alternate}
.happy{animation:happyPop .42s ease-in-out 4 alternate}
.listen{animation:listenTilt .55s ease-in-out infinite alternate}
@keyframes talkBob{from{transform:translateY(0) scale(1)}to{transform:translateY(-5px) scale(1.012)}}
@keyframes wavePop{from{transform:rotate(-1.2deg) scale(1)}to{transform:rotate(1.2deg) scale(1.018)}}
@keyframes happyPop{from{transform:translateY(0) scale(1)}to{transform:translateY(-9px) scale(1.02)}}
@keyframes listenTilt{from{transform:rotate(-.45deg)}to{transform:rotate(.45deg)}}
</style>
<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
</head>
<body>
<div id="stage">
  <iframe id="api-frame" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
  <div id="status">Aafiya 3D loading…</div>
  <div id="credit">3D model: “MUSLIM GIRL” by Najeeb chokli · CC BY</div>
</div>
<script>
(function(){
  const iframe=document.getElementById('api-frame');
  const status=document.getElementById('status');
  const uid='d7aa25c2c2ca4adc87af16043bbe7607';
  let api=null, anims=[], resetTimer=null;

  function ready(){
    status.style.display='none';
    try{Android.modelReady()}catch(e){}
  }
  function fail(msg){
    status.textContent='3D model load issue';
    try{Android.modelError(String(msg||'error'))}catch(e){}
  }

  function setVisualState(name){
    iframe.className='';
    if(name && name!=='idle') iframe.classList.add(name);
    if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}
    if(name==='wave'||name==='happy'){
      resetTimer=setTimeout(()=>setVisualState('idle'),2200);
    }
  }

  function playAnimationFor(name){
    if(!api || !anims || !anims.length) return;
    let pick=null;
    const wanted={
      talk:['talk','speak','idle'],
      wave:['wave','hello','greet','idle'],
      happy:['happy','smile','idle'],
      listen:['listen','think','idle'],
      idle:['idle','stand']
    }[name]||['idle'];

    for(const key of wanted){
      pick=anims.find(a=>String(a.name||'').toLowerCase().includes(key));
      if(pick) break;
    }
    if(!pick) pick=anims[0];
    try{
      if(api.setCurrentAnimationByUID) api.setCurrentAnimationByUID(pick.uid);
      if(api.setCycleMode) api.setCycleMode('one');
      if(api.play) api.play();
    }catch(e){}
  }

  window.setAafiyaPose=function(name){
    const state=['idle','wave','happy','talk','listen'].includes(name)?name:'idle';
    setVisualState(state);
    playAnimationFor(state);
  };

  try{
    const client=new Sketchfab('1.12.1',iframe);
    client.init(uid,{
      autostart:1,
      preload:1,
      transparent:1,
      ui_controls:0,
      ui_infos:0,
      ui_watermark:0,
      ui_hint:0,
      ui_help:0,
      ui_settings:0,
      ui_vr:0,
      ui_ar:0,
      ui_fullscreen:0,
      ui_annotations:0,
      success:function(viewerApi){
        api=viewerApi;
        api.start();
        api.addEventListener('viewerready',function(){
          try{
            api.getAnimations(function(err,list){
              if(!err && Array.isArray(list)) anims=list;
              ready();
            });
          }catch(e){ready();}
        });
      },
      error:function(){fail('viewer init error');}
    });
  }catch(e){fail(e);}

  iframe.addEventListener('load',function(){
    iframe.contentWindow;
  });

  document.getElementById('stage').addEventListener('click',function(){
    setVisualState('wave');
    playAnimationFor('wave');
    try{Android.characterTapped()}catch(e){}
  });
})();
</script>
</body>
</html>
