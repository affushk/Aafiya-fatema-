<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;
background:
radial-gradient(circle at 50% 28%,rgba(255,255,255,.99) 0%,rgba(255,250,253,.96) 38%,rgba(244,238,249,.96) 74%,rgba(236,230,246,.98) 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
padding:10px 15px;border-radius:18px;background:rgba(255,255,255,.90);
font:600 13px system-ui,-apple-system,sans-serif;color:#715c75;box-shadow:0 8px 25px rgba(90,60,90,.08);pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx{position:absolute;left:50%;top:56%;font-size:34px;opacity:0;animation:floatUp 1.2s ease-out forwards}
.fx:nth-child(2){margin-left:-72px;animation-delay:.08s}
.fx:nth-child(3){margin-left:72px;animation-delay:.16s}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,18px) scale(.72)}24%{opacity:1}100%{opacity:0;transform:translate(-50%,-130px) scale(1.22)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="stage">
  <div id="status">Cute white cat loading…</div>
  <div id="fx"></div>
</div>
<script>
(function(){
  const stage=document.getElementById('stage');
  const status=document.getElementById('status');
  const fx=document.getElementById('fx');

  let renderer,scene,camera,clock,mixer,cat,catRoot;
  let clips={},currentAction=null;
  let state='idle',stateUntil=0;
  let ready=false;
  let targetY=0.72;
  let baseY=0;
  let targetRotY=0;

  function notifyReady(){
    ready=true;
    status.style.display='none';
    try{Android.modelReady()}catch(e){}
  }
  function notifyError(message){
    status.style.display='block';
    status.textContent='3D cat load issue';
    try{Android.modelError(String(message||'load error'))}catch(e){}
  }

  function init(){
    scene=new THREE.Scene();
    clock=new THREE.Clock();

    camera=new THREE.PerspectiveCamera(27,1,.02,30);
    camera.position.set(0,.78,3.1);
    camera.lookAt(0,.68,0);

    renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.08;
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000,0);
    stage.insertBefore(renderer.domElement,status);

    const hemi=new THREE.HemisphereLight(0xfffbff,0xb5a5bd,1.35);
    scene.add(hemi);
    const key=new THREE.DirectionalLight(0xffffff,2.3);
    key.position.set(-2.4,4.1,3.4); key.castShadow=true;
    key.shadow.mapSize.set(1024,1024);
    key.shadow.camera.near=.1; key.shadow.camera.far=12;
    scene.add(key);
    const fill=new THREE.DirectionalLight(0xffddeb,1.0);
    fill.position.set(3.0,2.2,2.2); scene.add(fill);
    const rim=new THREE.DirectionalLight(0xd9dcff,.72);
    rim.position.set(-2.5,2,-3); scene.add(rim);

    const floorMat=new THREE.MeshStandardMaterial({color:0xf7edf5,roughness:.95,metalness:0,transparent:true,opacity:.85});
    const floor=new THREE.Mesh(new THREE.CircleGeometry(.92,64),floorMat);
    floor.rotation.x=-Math.PI/2; floor.position.y=-.015; floor.receiveShadow=true; scene.add(floor);

    resize();
    window.addEventListener('resize',resize);
    loadCat();
    renderer.domElement.addEventListener('click',function(){ try{Android.characterTapped()}catch(e){} });
    animate();
  }

  function resize(){
    const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
    if(cat) frameCat();
  }

  function cleanClipName(name){
    const parts=String(name||'').split('|');
    return parts[parts.length-1].trim();
  }

  function whiteFurMaterial(source){
    const mat=source.clone();
    mat.color=new THREE.Color(0xffffff);
    mat.metalness=0.0;
    mat.roughness=.68;
    if('envMapIntensity' in mat)mat.envMapIntensity=.22;
    if('vertexColors' in mat)mat.vertexColors=false;
    mat.transparent=false;
    mat.depthWrite=true;

    if(mat.map){
      mat.map.encoding=THREE.sRGBEncoding;
      mat.map.needsUpdate=true;
      mat.onBeforeCompile=function(shader){
        shader.fragmentShader=shader.fragmentShader.replace(
          '#include <map_fragment>',
          [
            '#ifdef USE_MAP',
            '  vec4 sampledDiffuseColor = texture2D( map, vUv );',
            '  sampledDiffuseColor = mapTexelToLinear( sampledDiffuseColor );',
            '  float lum = dot(sampledDiffuseColor.rgb, vec3(0.299,0.587,0.114));',
            '  float furMask = smoothstep(0.19,0.50,lum);',
            '  vec3 darkDetail = vec3(0.105,0.075,0.070);',
            '  vec3 whiteFur = vec3(0.965,0.955,0.970);',
            '  vec3 remapped = mix(darkDetail, whiteFur, furMask);',
            '  float warm = smoothstep(0.30,0.60,sampledDiffuseColor.r-sampledDiffuseColor.b);',
            '  remapped = mix(remapped, vec3(0.97,0.90,0.92), warm*0.14);',
            '  diffuseColor *= vec4(remapped, sampledDiffuseColor.a);',
            '#endif'
          ].join('\n')
        );
      };
      mat.customProgramCacheKey=()=> 'aafiya-white-cat-v2';
    }else{
      mat.color.setRGB(.965,.955,.97);
    }
    return mat;
  }

  function polishCat(root){
    root.traverse(function(o){
      if(!o.isMesh)return;
      o.castShadow=true; o.receiveShadow=true;
      if(Array.isArray(o.material))o.material=o.material.map(whiteFurMaterial);
      else if(o.material)o.material=whiteFurMaterial(o.material);
    });
  }

  function frameCat(){
    if(!cat)return;
    cat.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(cat);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());
    if(!isFinite(size.y)||size.y<=.001)return;

    const vFov=THREE.MathUtils.degToRad(camera.fov);
    const hFov=2*Math.atan(Math.tan(vFov/2)*Math.max(.35,camera.aspect));
    const distH=(size.y*.5)/Math.tan(vFov/2);
    const distW=(size.x*.5)/Math.tan(hFov/2);
    const dist=Math.max(distH,distW)*1.35;

    targetY=center.y + size.y*.02;
    camera.position.set(center.x,targetY+size.y*.02,center.z+dist);
    camera.near=Math.max(.02,dist/100);
    camera.far=dist+25;
    camera.lookAt(center.x,targetY,center.z);
    camera.updateProjectionMatrix();
  }

  function normalizeCat(){
    cat.scale.setScalar(1);
    cat.position.set(0,0,0);
    cat.rotation.set(0,0,0);
    cat.updateMatrixWorld(true);
    let box=new THREE.Box3().setFromObject(cat);
    let size=box.getSize(new THREE.Vector3());
    if(size.y<=.001)return;

    const targetHeight=1.55;
    const s=targetHeight/size.y;
    cat.scale.setScalar(s);
    cat.updateMatrixWorld(true);
    box.setFromObject(cat);
    const center=box.getCenter(new THREE.Vector3());
    cat.position.x-=center.x;
    cat.position.z-=center.z;
    cat.position.y-=box.min.y;
    baseY=cat.position.y;
    cat.updateMatrixWorld(true);

    // Face the camera. This model's authored forward points toward -Z.
    catRoot.rotation.y=Math.PI;
    catRoot.updateMatrixWorld(true);
    frameCat();
  }

  function loadCat(){
    const loader=new THREE.GLTFLoader();
    const primary='https://static.poly.pizza/67f5e3fe-37ee-4c86-95c8-d269d8c9f8ba.glb';
    const fallback='https://raw.githubusercontent.com/corosolto/client/03c08063295a9c1e1e595f527717d9d9d48e3625/public/models/ambient/cat_telhado.glb';

    function onLoaded(gltf){
      catRoot=new THREE.Group();
      cat=gltf.scene;
      catRoot.add(cat);
      scene.add(catRoot);
      polishCat(cat);

      mixer=new THREE.AnimationMixer(cat);
      (gltf.animations||[]).forEach(function(c){clips[cleanClipName(c.name).toLowerCase()]=c;});
      normalizeCat();
      playClip('idle',.18);
      notifyReady();
    }

    loader.load(primary,onLoaded,undefined,function(){
      status.textContent='Loading backup cat…';
      loader.load(fallback,onLoaded,undefined,function(err){notifyError(err&&err.message?err.message:'cat load failed');});
    });
  }

  function findClip(keys){
    const names=Object.keys(clips);
    for(const key of keys){
      const exact=clips[key.toLowerCase()]; if(exact)return exact;
      const found=names.find(n=>n.includes(key.toLowerCase())); if(found)return clips[found];
    }
    return clips.idle || (names.length?clips[names[0]]:null);
  }

  function playClip(kind,fade){
    if(!mixer)return;
    const map={
      idle:['idle'],
      eat:['idle_eating','eating','idle'],
      jump:['jump_start','jump_loop','run','idle'],
      happy:['headbutt','jump_start','idle'],
      run:['run','walk','idle'],
      walk:['walk','idle']
    };
    const clip=findClip(map[kind]||['idle']);
    if(!clip)return;

    const next=mixer.clipAction(clip);
    next.enabled=true;
    next.setEffectiveWeight(1);
    next.setEffectiveTimeScale(1);
    next.reset();
    if(currentAction && currentAction!==next)currentAction.fadeOut(fade||.15);
    next.fadeIn(fade||.15).play();
    currentAction=next;
  }

  function setState(name){
    state=name||'idle';
    const now=performance.now();
    if(state==='eat'){playClip('eat');stateUntil=now+2600;}
    else if(state==='happy'||state==='wave'){playClip('happy');stateUntil=now+1900;}
    else if(state==='sleep'){playClip('idle');stateUntil=now+6000;}
    else if(state==='talk'){playClip('idle');stateUntil=Infinity;}
    else if(state==='listen'){playClip('idle');stateUntil=Infinity;}
    else {playClip('idle');stateUntil=Infinity;}
  }

  window.setAafiyaPose=function(name){
    const n=String(name||'idle').toLowerCase();
    if(n==='food')setState('eat');
    else if(['idle','wave','happy','talk','listen','sleep'].includes(n))setState(n);
    else setState('idle');
  };

  window.showAafiyaEffect=function(kind){
    const map={heart:'💗',food:'🍓',bath:'🫧',zzz:'💤',music:'🎵',star:'✨',coin:'⭐'};
    const icon=map[kind]||'✨';
    fx.innerHTML='';
    for(let i=0;i<3;i++){
      const el=document.createElement('div');el.className='fx';el.textContent=icon;fx.appendChild(el);
    }
    setTimeout(function(){fx.innerHTML='';},1400);
  };

  function animate(){
    requestAnimationFrame(animate);
    if(!renderer)return;
    const dt=Math.min(.05,clock.getDelta());
    const t=performance.now()/1000;

    if(mixer)mixer.update(dt);
    if(catRoot&&cat){
      if((state==='happy'||state==='wave'||state==='eat') && performance.now()>stateUntil)setState('idle');

      let y=0,rx=0,rz=0,scale=1;
      if(state==='idle'){y=Math.sin(t*2.1)*.004;rz=Math.sin(t*.65)*.008;}
      if(state==='listen'){rz=Math.sin(t*1.9)*.035;rx=.018;}
      if(state==='talk'){y=Math.abs(Math.sin(t*8.5))*.012;scale=1+Math.sin(t*8.5)*.006;}
      if(state==='happy'||state==='wave'){y=Math.abs(Math.sin(t*5.5))*.018;rz=Math.sin(t*4.2)*.025;}
      if(state==='sleep'){rx=-.03;scale=.985;}

      cat.position.y=baseY+y;
      catRoot.rotation.x=rx;
      catRoot.rotation.z=rz;
      catRoot.scale.setScalar(scale);
      catRoot.rotation.y += (Math.PI+targetRotY-catRoot.rotation.y)*Math.min(1,dt*5);
    }
    renderer.render(scene,camera);
  }

  init();
})();
</script>
</body>
</html>
