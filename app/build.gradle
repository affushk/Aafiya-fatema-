plugins {
    id 'com.android.application'
}

android {
    namespace 'com.altaf.aafiyafatema'
    compileSdk 35

    defaultConfig {
        applicationId 'com.altaf.aafiyafatema'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '5.2-white-cat-framing-fix'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
