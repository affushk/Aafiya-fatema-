plugins {
    id 'com.android.application'
}

android {
    namespace 'com.altaf.aafiyafatema'
    compileSdk 35

    defaultConfig {
        applicationId 'com.altaf.aafiyafatema'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '5.3-hero-framing-white-cat'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
